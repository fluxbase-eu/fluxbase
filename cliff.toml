# git-cliff configuration: release notes and CHANGELOG.md are generated
# deterministically from the conventional-commit history (enforced by
# lefthook's commit-msg hook). CI runs this at release time; preview locally
# with `make release-notes`. Docs: https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to Fluxbase are documented in this file. The server is
versioned with CalVer (YYYY.M.N); the JS/TS SDKs use SemVer.

This file is generated from the conventional-commit history by
[git-cliff](https://github.com/orhun/git-cliff) at release time — do not
hand-edit release sections. See RELEASING.md for the release process.
"""
body = """
{% if version %}
## {{ version }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}
## Unreleased
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}

{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{%- if commit.remote.username %} @{{ commit.remote.username }}{% endif %}\
{%- if commit.breaking %} — **breaking change**{% endif %}
{% endfor %}
{% endfor %}
"""
footer = "<!-- generated by git-cliff; do not edit release sections by hand -->"

[remote.github]
# Enriches entries with PR numbers and contributor handles when a token is
# available (CI passes GH_TOKEN; offline runs simply omit the extras).
owner = "nimbleflux"
repo = "fluxbase"

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
# CalVer tags only (v2026.9.10, v2026.9.10-rc.1).
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+(-rc\\.[0-9]+)?$"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^revert", group = "Reverted" },
  { message = "^doc", group = "Documentation" },
  { message = "^test", group = "Tests" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^build", group = "Build" },
  { message = "^ci", group = "CI" },
  { message = "^chore\\(deps", group = "Dependencies" },
  { message = "^chore", group = "Miscellaneous" },
]
