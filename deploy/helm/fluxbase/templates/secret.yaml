{{- if not .Values.existingSecret }}
{{- /* Secret stabilization (upgrade-safe):
Every generated value below is read back with `lookup` on upgrades, so the
chart reuses the secret that install created instead of rotating it on every
`helm upgrade`. Precedence per key: explicit values.* > existing Secret
(base64-decoded) > fresh randAlphaNum (first install only). Rotating a secret
deliberately requires deleting the Secret (or changing the explicit value),
not just re-running helm upgrade. Requires read access to Secrets in the
release namespace (default for the GITHUB_TOKEN-like identities Helm runs
with; RBAC-restricted environments can set explicit values instead). */}}
{{- $existing := lookup "v1" "Secret" (include "fluxbase.namespace" .) (include "fluxbase.fullname" .) -}}
{{- $existingData := dict -}}
{{- if $existing -}}
{{- $existingData = $existing.data | default dict -}}
{{- end -}}
{{- $jwtSecret := .Values.config.auth.jwt_secret -}}
{{- if not $jwtSecret -}}
{{- $jwtSecret = index $existingData "jwt-secret" | default "" | b64dec -}}
{{- end -}}
{{- if not $jwtSecret -}}
{{- $jwtSecret = randAlphaNum 64 -}}
{{- end -}}
{{- $setupToken := .Values.config.security.setup_token -}}
{{- if not $setupToken -}}
{{- $setupToken = index $existingData "setup-token" | default "" | b64dec -}}
{{- end -}}
{{- if not $setupToken -}}
{{- $setupToken = randAlphaNum 32 -}}
{{- end -}}
{{- /* Encryption key for secrets at rest (must be exactly 32 chars for
AES-256-GCM). Falls back to a generated value so fresh installs start; the
lookup above keeps that generated value stable across upgrades, so data
encrypted with it stays readable. Set config.encryption_key explicitly or use
existingSecret to control the key lifecycle yourself. */}}
{{- $encryptionKey := .Values.config.encryption_key -}}
{{- if not $encryptionKey -}}
{{- $encryptionKey = index $existingData "encryption-key" | default "" | b64dec -}}
{{- end -}}
{{- if not $encryptionKey -}}
{{- $encryptionKey = randAlphaNum 32 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fluxbase.fullname" . }}
  namespace: {{ include "fluxbase.namespace" . | quote }}
  labels: {{- include "fluxbase.labels" . | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- toYaml .Values.commonAnnotations | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{- if not .Values.postgresql.enabled }}
  database-password: {{ .Values.externalDatabase.password | default (randAlphaNum 16) | b64enc | quote }}
  {{- end }}
  jwt-secret: {{ $jwtSecret | b64enc | quote }}
  setup-token: {{ $setupToken | b64enc | quote }}
  {{- if and .Values.config.security.captcha .Values.config.security.captcha.enabled .Values.config.security.captcha.secret_key }}
  captcha-secret-key: {{ .Values.config.security.captcha.secret_key | b64enc | quote }}
  {{- end }}
  {{- if eq .Values.config.storage.provider "s3" }}
  s3-access-key: {{ .Values.config.storage.s3_access_key | default "" | b64enc | quote }}
  s3-secret-key: {{ .Values.config.storage.s3_secret_key | default "" | b64enc | quote }}
  {{- end }}
  {{- if .Values.config.email.enabled }}
  {{- if .Values.config.email.smtp_password }}
  smtp-password: {{ .Values.config.email.smtp_password | b64enc | quote }}
  {{- end }}
  {{- if .Values.config.email.sendgrid_api_key }}
  sendgrid-api-key: {{ .Values.config.email.sendgrid_api_key | b64enc | quote }}
  {{- end }}
  {{- if .Values.config.email.mailgun_api_key }}
  mailgun-api-key: {{ .Values.config.email.mailgun_api_key | b64enc | quote }}
  {{- end }}
  {{- if .Values.config.email.ses_access_key }}
  ses-access-key: {{ .Values.config.email.ses_access_key | b64enc | quote }}
  {{- end }}
  {{- if .Values.config.email.ses_secret_key }}
  ses-secret-key: {{ .Values.config.email.ses_secret_key | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.config.ai.enabled }}
  {{- if .Values.config.ai.openai_api_key }}
  openai-api-key: {{ .Values.config.ai.openai_api_key | b64enc | quote }}
  {{- end }}
  {{- if .Values.config.ai.azure_api_key }}
  azure-api-key: {{ .Values.config.ai.azure_api_key | b64enc | quote }}
  {{- end }}
  {{- end }}
  encryption-key: {{ $encryptionKey | b64enc | quote }}
{{- end }}
