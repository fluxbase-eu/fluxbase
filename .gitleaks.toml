# Extends gitleaks' default rule set (gitleaks detect auto-loads this file).
[extend]
useDefault = true

[[allowlists]]
# The contract-drift CI job (ci.yml) boots a throwaway local server whose
# fixture values MUST satisfy the application boot guard's entropy
# requirements, so they are intentionally high-entropy. They are CI-only and
# never deployed. Commit-scoped .gitleaksignore fingerprints break every time
# a merge shifts the job's line numbers, hence the path+rule allowlist.
# Other rules still scan this file, so a genuinely leaked credential in a
# workflow is still caught.
description = "Contract-drift CI fixture secrets (high-entropy by boot-guard requirement, CI-only)"
rules = ["generic-api-key", "stripe-access-token"]
paths = ['''^\.github/workflows/ci\.yml$''']

[[allowlists]]
# The docs are, by definition, full of curl examples whose Authorization
# headers carry placeholders like YOUR_SERVICE_ROLE_KEY. Whether they trip
# the default curl-auth-header rule depends on placeholder entropy, which
# makes the scan flap on unrelated docs PRs (it flagged the knowledge-bases
# guide in #435). Only curl-auth-header is exempted for docs paths: every
# other rule (generic-api-key, jwt, ...) still scans docs, so a real
# credential pasted into an example is still caught.
description = "Docs curl examples with placeholder Authorization headers"
rules = ["curl-auth-header"]
paths = ['''^docs/''']
