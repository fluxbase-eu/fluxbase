# go-test-coverage configuration
# See: https://github.com/vladopajic/go-test-coverage

profile: coverage.out

threshold:
  package: 0    # Per-package minimum (enforced via overrides below)
  total: 25     # Overall project target

# Override rules for specific patterns (evaluated in order, most specific first)
override:
  # Well-tested packages - enforce minimum coverage to prevent regression
  - path: ^internal/crypto/
    threshold: 75
  - path: ^internal/logging/
    threshold: 70
  # Pure logic packages at ~100% — set below measured to leave headroom
  - path: ^internal/loader/
    threshold: 90
  - path: ^internal/util/
    threshold: 90
  - path: ^internal/observability/
    threshold: 50
  - path: ^internal/ratelimit/
    threshold: 50
  - path: ^internal/storage/
    threshold: 45
  - path: ^internal/email/
    threshold: 40
  - path: ^internal/config/
    threshold: 40
  - path: ^internal/realtime/
    threshold: 45
  - path: ^internal/rpc/
    threshold: 35
  - path: ^internal/runtime/
    threshold: 35
  - path: ^internal/middleware/
    threshold: 30
  - path: ^internal/auth/
    threshold: 25
  - path: ^internal/webhook/
    threshold: 25
  - path: ^internal/ai/
    threshold: 20
  - path: ^internal/functions/
    threshold: 23
  - path: ^internal/mcp/
    threshold: 20
  - path: ^internal/api/
    threshold: 15
  - path: ^internal/pubsub/
    threshold: 15
  - path: ^internal/jobs/
    threshold: 15
  - path: ^internal/branching/
    threshold: 25
  # DB-backed packages whose logic mostly runs through the integration
  # (non-short) suites, so -short unit coverage is structurally low. Floors
  # are set to max(2, floor(current -short coverage - 2)) — a small ratchet
  # that prevents regression to 0 without gating on coverage the short suite
  # cannot produce. Measured 2026-10-11 via:
  #   go test -short -cover ./internal/<pkg>/...
  # TODO: re-measure and re-ratchet upward as the short-mode unit suites grow.
  # NOTE: first matching entry wins - keep more-specific paths above their
  # parent prefixes.
  - path: ^internal/database/bootstrap
    # Measured 9.2% (-short; observed in the 2026-10-11 gate run). Floor = 9 - 1.
    threshold: 8
  - path: ^internal/database/
    # Measured 23.7% aggregate (root 22.1%; schema/ and connection.go excluded
    # per the exclude rules above). Floor = 23 - 2 rounded down.
    threshold: 20
  - path: ^internal/settings/
    # Measured 6.4% (-short). Floor = 6 - 2.
    threshold: 4
  - path: ^internal/secrets/
    # Measured 1.6% (-short): handler/storage tests are integration-gated.
    # The ratchet formula would yield 2, which would fail the gate today —
    # keep 1 until short-mode coverage reaches >= 4%, then raise to 2.
    threshold: 1
  - path: ^internal/extensions/
    # Measured 3.0% (-short). Floor = max(2, 3 - 2).
    threshold: 2
  # Declarative migration engine: core planning/transform/diff helpers are now
  # unit-tested (extractChangesFromGroups, changePriority, table-name
  # extractors, column-def extraction, FK-name loading/filtering, fingerprint,
  # preprocessSchemaFile, writePlanToTemp, etc.). The remaining surface is
  # pgschema shell-out + DB execution, covered by integration tests.
  # TODO: raise further once the partition/FK filters and plan validation
  # are factored out of applyPlanDirectly.
  - path: ^internal/migrations/
    threshold: 15

  # Test utilities don't need coverage themselves
  - path: ^internal/testutil
    threshold: 0

  # CLI utility packages - enforce minimum coverage
  - path: ^cli/client/
    threshold: 30
  - path: ^cli/config/
    threshold: 30
  - path: ^cli/output/
    threshold: 40
  - path: ^cli/util/
    threshold: 50

# Exclude patterns (regex) - remove from coverage calculation entirely
exclude:
  paths:
    # Pure type definitions without business logic
    - ^internal/query/types\.go$
    - ^internal/branching/types\.go$
    - ^internal/jobs/types\.go$
    - ^internal/rpc/types\.go$
    - ^internal/mcp/types\.go$
    - ^internal/runtime/types\.go$
    - ^internal/extensions/models\.go$
    - ^internal/storage/log_types\.go$
    - ^internal/api/rest_errors\.go$
    - ^internal/api/graphql_types\.go$
    - ^internal/branching/errors\.go$
    - ^internal/database/errors\.go$

    # Interface definitions
    - ^internal/auth/interfaces\.go$

    # Large generated specification files
    - ^internal/api/openapi\.go$

    # Infrastructure code (requires system dependencies, tested via E2E)
    - ^internal/scaling/leader\.go$
    - ^internal/database/connection\.go$
    - ^internal/database/schema/
    - ^internal/ai/ocr_tesseract\.go$

    # Entry points and embedded assets
    - ^cmd/fluxbase/main\.go$
    - ^internal/adminui/

    # CLI commands (tested via mock server tests)
    - ^cli/cmd/

    # CLI entry point
    - ^cli/main\.go$

    # Test utilities
    - ^internal/testutil/
