version: "2"

run:
  timeout: 12m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - errorlint
    - govet
    # staticcheck was disabled after a golangci-lint v2.10.0 panic; v2.14.0
    # runs clean under the Go 1.26.9/1.27 toolchains (re-enabled in #393).
    - staticcheck
    - unused
  settings:
    errcheck:
      check-type-assertions: false
      # check-blank stays off for now: enabling it surfaces ~449 blank-assignment
      # findings across the tree (tracked for a mechanical ratchet in #393).
      check-blank: false
      exclude-functions:
        - (io.Closer).Close
        - (*database/sql.Rows).Close
        - (*database/sql/DB).Close
        - os.Setenv
        - os.Unsetenv
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        - fmt.Print
        - fmt.Printf
        - fmt.Println
        - fmt.Scanf
        - fmt.Scanln
        - fmt.Scan
    errorlint:
      errorf: true
      comparison: true
      asserts: true
      errorf-multi: true
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - govet
      - path: cli/
        linters:
          - errcheck

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra-rules: false
    goimports:
      local-prefixes:
        - github.com/nimbleflux/fluxbase

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
